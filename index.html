<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Thai E-Ink Desk Calendar</title>
<style>
  :root { color-scheme: light; --ink:#111; --paper:#fff; --muted:#555; --line:#aaa; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; background:var(--paper); color:var(--ink); }
  body { font-family: system-ui, "Noto Sans Thai", "Noto Sans", sans-serif; padding:3.2vw 4vw; }
  .page { max-width:1100px; margin:0 auto; min-height:92vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--ink); padding-bottom:1.1rem; }
  .brand { font-size:clamp(16px,2.3vw,25px); font-weight:700; letter-spacing:.06em; }
  .live { font-size:clamp(12px,1.6vw,16px); color:var(--muted); }
  .main { display:grid; grid-template-columns:1.15fr .85fr; gap:4vw; padding:3vh 0 2vh; flex:1; }
  .time-area { display:flex; flex-direction:column; justify-content:center; }
  #time { font-variant-numeric:tabular-nums; font-size:clamp(76px,15vw,180px); line-height:.95; font-weight:600; letter-spacing:-.055em; white-space:nowrap; }
  #weekday { font-size:clamp(28px,5vw,56px); font-weight:600; margin-top:2vh; }
  #dateLine { font-size:clamp(18px,3vw,32px); margin-top:.5vh; color:#333; }
  .btc { margin-top:2.8vh; padding-top:1.4vh; border-top:1px solid var(--line); max-width:500px; }
  .weather { margin-top:2.8vh; padding-top:1.4vh; border-top:1px solid var(--line); max-width:500px; }
  .weather-label { font-size:clamp(13px,1.7vw,19px); letter-spacing:.1em; font-weight:700; }
  #weatherNow { font-size:clamp(24px,4vw,44px); font-weight:600; margin-top:.5vh; }
  #weatherMeta { font-size:clamp(12px,1.5vw,16px); color:var(--muted); margin-top:.5vh; }
  .btc-label { font-size:clamp(13px,1.7vw,19px); letter-spacing:.1em; font-weight:700; }
  #btcPrice { font-size:clamp(28px,4.8vw,56px); font-weight:600; margin-top:.5vh; font-variant-numeric:tabular-nums; }
  #btcMeta { font-size:clamp(12px,1.5vw,16px); color:var(--muted); margin-top:.5vh; }
  .calendar-area { display:flex; flex-direction:column; justify-content:center; }
  .month-title { font-size:clamp(26px,4vw,46px); font-weight:700; margin-bottom:1.5vh; text-align:center; }
  .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:.4vw; }
  .dow { text-align:center; font-size:clamp(13px,1.7vw,20px); font-weight:700; padding:.7vh 0 1.1vh; border-bottom:1px solid var(--line); }
  .day { aspect-ratio:1.12; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:clamp(17px,2.5vw,29px); border-radius:10px; font-variant-numeric:tabular-nums; position:relative; }
  .day.holiday { font-weight:700; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; }
  .day.today { background:var(--ink); color:var(--paper); font-weight:700; text-decoration:none; }
  .day.empty { visibility:hidden; }
  .holiday-list { margin-top:1.4vh; border-top:1px solid var(--line); padding-top:1vh; font-size:clamp(11px,1.35vw,15px); line-height:1.55; }
  .holiday-heading { font-weight:700; margin-bottom:.3vh; }
  .holiday-item { display:flex; gap:.5em; }
  .holiday-date { min-width:2.2em; font-weight:700; }
  .holiday-none { color:var(--muted); }
  footer { border-top:1px solid var(--line); padding-top:1vh; display:flex; justify-content:space-between; color:var(--muted); font-size:clamp(11px,1.4vw,15px); }
  @media (max-width:650px) {
    body { padding:4vw; }
    .main { grid-template-columns:1fr; gap:3vh; }
    #time { font-size:clamp(76px,24vw,130px); }
    #weekday { font-size:clamp(28px,9vw,46px); }
    #dateLine { font-size:clamp(18px,5vw,27px); }
    .btc { margin-top:2.5vh; }
    .calendar-area { max-width:520px; width:100%; margin:0 auto; }
    .day { aspect-ratio:1.25; font-size:clamp(17px,5vw,25px); }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">DESK DISPLAY</div>
    <div class="live">E-INK · THAILAND</div>
  </header>
  <main class="main">
    <section class="time-area">
      <div id="time">--:--</div>
      <div id="weekday">กำลังโหลด…</div>
      <div id="dateLine">—</div>
      <div class="btc">
        <div class="btc-label">BITCOIN · BTC/USD</div>
        <div id="btcPrice">กำลังโหลดราคา…</div>
        <div id="btcMeta">อัปเดตราคาทุก 5 นาที</div>
      </div>
      <div class="weather">
        <div class="weather-label">WEATHER · พระราม 2 กรุงเทพฯ</div>
        <div id="weatherNow">กำลังโหลดอากาศ…</div>
        <div id="weatherMeta">อัปเดตทุก 15 นาที</div>
      </div>
    </section>
    <section class="calendar-area">
      <div class="month-title" id="monthTitle">—</div>
      <div class="calendar" id="calendar"></div>
      <div class="holiday-list" id="holidayList"></div>
    </section>
  </main>
  <footer><span>Minimal Thai Calendar</span><span id="updatedAt">ราคา BTC: —</span></footer>
</div>
<script>
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_DAYS = ['อา','จ','อ','พ','พฤ','ศ','ส'];
// วันหยุดราชการไทยปี 2569 รวมวันหยุดพิเศษที่ประกาศเพิ่มเติม
const TH_HOLIDAYS = {
  '2026-01-01':'วันขึ้นปีใหม่', '2026-01-02':'วันหยุดพิเศษ',
  '2026-03-03':'วันมาฆบูชา',
  '2026-04-06':'วันจักรี', '2026-04-13':'วันสงกรานต์', '2026-04-14':'วันสงกรานต์', '2026-04-15':'วันสงกรานต์',
  '2026-05-01':'วันแรงงานแห่งชาติ', '2026-05-04':'วันฉัตรมงคล',
  '2026-06-01':'ชดเชยวันวิสาขบูชา', '2026-06-03':'วันเฉลิมพระชนมพรรษาพระราชินี',
  '2026-07-28':'วันเฉลิมพระชนมพรรษาพระบาทสมเด็จพระเจ้าอยู่หัว', '2026-07-29':'วันอาสาฬหบูชา',
  '2026-08-12':'วันแม่แห่งชาติ',
  '2026-10-13':'วันนวมินทรมหาราช', '2026-10-16':'วันหยุดพิเศษ', '2026-10-23':'วันปิยมหาราช',
  '2026-12-07':'ชดเชยวันพ่อแห่งชาติ', '2026-12-10':'วันรัฐธรรมนูญ', '2026-12-16':'วันหยุดราชการกรณีพิเศษ', '2026-12-31':'วันสิ้นปี'
};
const pad = n => String(n).padStart(2,'0');
function updateClockAndCalendar(){
  const now = new Date();
  const time = new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
  document.getElementById('time').textContent = time;
  document.getElementById('weekday').textContent = new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',weekday:'long'}).format(now);
  document.getElementById('dateLine').textContent = new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'long',year:'numeric'}).format(now);
  // Calendar based on local browser date; Thai year (B.E.)
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  document.getElementById('monthTitle').textContent = `${TH_MONTHS[m]} ${y+543}`;
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  TH_DAYS.forEach(day => { const el=document.createElement('div'); el.className='dow'; el.textContent=day; cal.appendChild(el); });
  const offset = new Date(y,m,1).getDay();
  const count = new Date(y,m+1,0).getDate();
  for(let i=0;i<offset;i++){const el=document.createElement('div');el.className='day empty';cal.appendChild(el);}
  const monthHolidays=[];
  for(let day=1;day<=count;day++){
    const key=`${y}-${pad(m+1)}-${pad(day)}`, holiday=TH_HOLIDAYS[key];
    const el=document.createElement('div'); el.className='day'+(day===d?' today':'')+(holiday?' holiday':'');
    const number=document.createElement('span'); number.textContent=day; el.appendChild(number);
    if(holiday) monthHolidays.push({day,name:holiday});
    cal.appendChild(el);
  }
  const holidayList=document.getElementById('holidayList');
  holidayList.innerHTML='<div class="holiday-heading">วันหยุดราชการเดือนนี้</div>';
  if(monthHolidays.length){
    monthHolidays.forEach(item=>{const row=document.createElement('div');row.className='holiday-item';const date=document.createElement('span');date.className='holiday-date';date.textContent=item.day;const name=document.createElement('span');name.textContent=item.name;row.append(date,name);holidayList.appendChild(row);});
  } else { const none=document.createElement('div');none.className='holiday-none';none.textContent='ไม่มีวันหยุดราชการในเดือนนี้';holidayList.appendChild(none); }
  const totalCells = offset+count;
  const remaining = (7-(totalCells%7))%7;
  for(let i=0;i<remaining;i++){const el=document.createElement('div');el.className='day empty';cal.appendChild(el);}
}
async function updateBitcoin(){
  const priceEl=document.getElementById('btcPrice'), metaEl=document.getElementById('btcMeta'), stampEl=document.getElementById('updatedAt');
  try{
    const response=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_last_updated_at=true',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const data=await response.json();
    const price=data?.bitcoin?.usd;
    if(typeof price!=='number') throw new Error('Missing BTC price');
    priceEl.textContent='$'+price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const refreshed=new Date();
    const refreshText=refreshed.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false});
    const sourceTime=data?.bitcoin?.last_updated_at ? new Date(data.bitcoin.last_updated_at*1000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false}) : refreshText;
    metaEl.textContent='CoinGecko · Price data '+sourceTime+' · Checked '+refreshText+' · Refresh 5 min';
    stampEl.textContent='อัปเดต '+refreshText+' น.';
  }catch(e){
    metaEl.textContent='ดึงราคา BTC/USD ไม่สำเร็จ · ลองใหม่ใน 5 นาที';
    stampEl.textContent='ราคา BTC ไม่พร้อม';
  }
}
updateClockAndCalendar();
updateBitcoin();
setInterval(updateClockAndCalendar,10*1000);
setInterval(updateBitcoin,2*60*1000);

const WEATHER_LABELS={0:'ท้องฟ้าแจ่มใส',1:'ส่วนใหญ่แจ่มใส',2:'มีเมฆบางส่วน',3:'มีเมฆมาก',45:'หมอก',48:'หมอกหนา',51:'ฝนปรอยเล็กน้อย',53:'ฝนปรอย',55:'ฝนปรอยหนัก',56:'ฝนเยือกแข็งปรอย',57:'ฝนเยือกแข็งหนัก',61:'ฝนเล็กน้อย',63:'ฝนปานกลาง',65:'ฝนหนัก',66:'ฝนเยือกแข็ง',67:'ฝนเยือกแข็งหนัก',71:'หิมะเล็กน้อย',73:'หิมะปานกลาง',75:'หิมะหนัก',77:'เกล็ดหิมะ',80:'ฝนเป็นช่วงเล็กน้อย',81:'ฝนเป็นช่วง',82:'ฝนเป็นช่วงหนัก',85:'หิมะเป็นช่วง',86:'หิมะเป็นช่วงหนัก',95:'ฝนฟ้าคะนอง',96:'ฝนฟ้าคะนองมีลูกเห็บ',99:'ฝนฟ้าคะนองหนัก'};
async function updateWeather(){
  const main=document.getElementById('weatherNow'), meta=document.getElementById('weatherMeta');
  try{
    // Approximate Rama 2 / Bang Khun Thian area, Bangkok
    const url='https://api.open-meteo.com/v1/forecast?latitude=13.66&longitude=100.43&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Asia%2FBangkok';
    const response=await fetch(url,{cache:'no-store'}); if(!response.ok) throw new Error('HTTP '+response.status);
    const data=await response.json(), c=data.current;
    const desc=WEATHER_LABELS[c.weather_code]||'สภาพอากาศ';
    main.textContent=`${desc} · ${Math.round(c.temperature_2m)}°C`;
    const t=new Date(c.time); const stamp=t.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false});
    meta.textContent=`รู้สึกเหมือน ${Math.round(c.apparent_temperature)}°C · ความชื้น ${c.relative_humidity_2m}% · ลม ${Math.round(c.wind_speed_10m)} กม./ชม. · ${stamp} น.`;
  }catch(e){main.textContent='ข้อมูลอากาศไม่พร้อม'; meta.textContent='จะลองดึงข้อมูลใหม่ใน 15 นาที';}
}
updateWeather();
setInterval(updateWeather,15*60*1000);
</script>
</body>
</html>
